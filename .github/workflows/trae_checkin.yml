name: TRAE Daily Check-in

# 想要准点可加外部触发，见 GUIDE.md「二、准点触发」
on:
  schedule:
    - cron: '23 2 * * *'  # UTC 2:23 = 北京 10:23（错开整点高峰）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trae-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run TRAE check-in
        env:
          TRAE_JWT: ${{ secrets.TRAE_JWT }}
          TRAE_DEVICE_ID: ${{ secrets.TRAE_DEVICE_ID }}
        run: python3 trae_checkin.py
